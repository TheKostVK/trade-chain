services:

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: trade-chain-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-trade_chain}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # test_case.sql намеренно не монтируется: он очищает БД и предназначен
      # только для ручного тестирования, а не для стартового набора mock API.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5



  app:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: trade-chain-back
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-trade_chain}?sslmode=disable
      PORT: 8080
      # Тестовый секрет; в окружении платформы может быть переопределён через JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:-6rCrf1rHP9xs3mLvhiBpF3YlZ4qKgMt1SPgwSxchZY6Ry79HrUurOCQnTGQPTQ}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174
      # Вход выбором участника из списка — ход ради демонстрации: чтобы увидеть
      # обмен, нужны две стороны с товарами и историей, а пустой свежий аккаунт
      # не показывает ничего. Пароль при таком входе не спрашивается, поэтому
      # флаг явный и в боевом окружении просто не выставляется.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      # Сброс демо-стенда стирает все обмены разом, поэтому маршрут
      # /demo/reset поднимается только с явно заданным секретом.
      DEMO_RESET_SECRET: ${DEMO_RESET_SECRET:-}

    ports:
      - "8080:8080"



  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080

    container_name: trade-chain-front

    depends_on:
      - app

    ports:
      - "3000:80"
volumes:
  postgres_data:
